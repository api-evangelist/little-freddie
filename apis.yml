name: Little Freddie
description: 'Little Freddie (Sunny Fields Enterprise Ltd) is a UK-based organic baby
  and toddler food brand producing nutritious weaning products for infants from six
  months, developed with a paediatric dietitian to meet UK and EU baby-food guidelines.
  Its ranges include Greek-style yoghurts, Simply Fruit purees, Full of Veg meals,
  dairy-free alternatives, home-style meals and omega-3 "Good for Brains" options,
  sold through major UK retailers including Tesco, Sainsbury''s, Asda, Morrisons, Co-op,
  Ocado, Booths and Spar. The company also runs a Parenting Hub with weaning, nutrition
  and parenting content. Surfaced as a portfolio company of Hillhouse; this profile
  currently exposes no public developer API surface.'
